name: release

on:
  push:
    tags:
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Environment tag, for example general-v2
        required: true
        type: string
      recover_existing:
        description: Replace an existing alias only after its release smoke has failed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_PUSH_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
  SOURCE_ROOT: ${{ github.workspace }}/release-source
  YQ_VERSION: v4.53.3

jobs:
  publish:
    name: Publish ${{ matrix.account }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account:
          - prod
          - preview
    steps:
      - name: Resolve requested tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RECOVER_EXISTING_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_existing || false }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[a-z0-9][a-z0-9-]*-v[1-9][0-9]*$ ]]; then
            echo "invalid environment tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          {
            echo "tag=$REQUESTED_TAG"
            echo "recover_existing=$RECOVER_EXISTING_INPUT"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}

      - name: Check out requested source tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: release-source
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Install yq
        run: |
          sudo curl --fail --silent --show-error --location --retry 5 \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Verify checked-out tag and manifest
        env:
          REQUESTED_TAG: ${{ steps.release.outputs.tag }}
          RECOVER_EXISTING_INPUT: ${{ steps.release.outputs.recover_existing }}
        run: |
          tooling_commit="$(git rev-parse HEAD)"
          tag_commit="$(git -C "$SOURCE_ROOT" rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")"
          head_commit="$(git -C "$SOURCE_ROOT" rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "checked-out commit $head_commit does not match tag $REQUESTED_TAG at $tag_commit" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_PUSH_COMMIT" && "$head_commit" != "$EXPECTED_PUSH_COMMIT" ]]; then
            echo "checked-out tag moved from pushed commit $EXPECTED_PUSH_COMMIT to $head_commit" >&2
            exit 1
          fi
          env_name="${REQUESTED_TAG%-v*}"
          version="${REQUESTED_TAG##*-v}"
          manifest="${SOURCE_ROOT}/envs/${env_name}/manifest.yaml"
          if [[ ! -f "$manifest" ]]; then
            echo "environment manifest not found: $manifest" >&2
            exit 1
          fi
          manifest_name="$(yq -r '.name' "$manifest")"
          manifest_version="$(yq -r '.version' "$manifest")"
          if [[ "$env_name" != "$manifest_name" || "$version" != "$manifest_version" ]]; then
            echo "tag $REQUESTED_TAG does not match $manifest" >&2
            exit 1
          fi
          {
            echo "ENV_NAME=$env_name"
            echo "TEMPLATE=firna-${REQUESTED_TAG}"
            echo "RECOVER_EXISTING=$RECOVER_EXISTING_INPUT"
          } >> "$GITHUB_ENV"
          echo "release tooling commit: $tooling_commit"
          echo "release source commit: $head_commit"

      - name: Install E2B SDK
        run: python3 -m pip install --requirement requirements.txt

      - name: Stage or reuse template
        id: template
        env:
          E2B_API_KEY: ${{ matrix.account == 'prod' && secrets.E2B_API_KEY_PROD || secrets.E2B_API_KEY_PREVIEW }}
        run: |
          stage_tag="stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.account }}"
          source_options=(--source-root "$SOURCE_ROOT")
          build_options=(
            --skip-existing
            --stage-tag "$stage_tag"
            --result-file "$GITHUB_OUTPUT"
          )
          if [[ "$RECOVER_EXISTING" == 'true' ]]; then
            source_options+=(--allow-legacy-manifest)
            build_options+=(--recover-existing)
          fi
          ./scripts/build_template.sh "${source_options[@]}" "$ENV_NAME" "${build_options[@]}"

      - name: Smoke-test staged or published template
        env:
          E2B_API_KEY: ${{ matrix.account == 'prod' && secrets.E2B_API_KEY_PROD || secrets.E2B_API_KEY_PREVIEW }}
        run: >-
          python3 scripts/run_in_sandbox.py
          "${{ steps.template.outputs.template_ref }}"
          "${SOURCE_ROOT}/envs/${ENV_NAME}/verify.sh"

      - name: Promote smoke-tested template
        if: steps.template.outputs.needs_promotion == 'true'
        env:
          E2B_API_KEY: ${{ matrix.account == 'prod' && secrets.E2B_API_KEY_PROD || secrets.E2B_API_KEY_PREVIEW }}
        run: |
          promotion_options=(
            --staging-template "${{ steps.template.outputs.template_ref }}"
            --final-template "$TEMPLATE"
            --expected-template-id "${{ steps.template.outputs.template_id }}"
          )
          if [[ "$RECOVER_EXISTING" == 'true' ]]; then
            promotion_options+=(--allow-reassign)
          fi
          python3 scripts/promote_template.py "${promotion_options[@]}"
